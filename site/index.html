<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>AI-Mola Контроль</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script>
    // Тему ставимо до рендера, щоб не блимало
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__title">
      <h1>AI-Mola-manager</h1>
      <p class="muted" id="freshness">Завантаження…</p>
    </div>
    <div class="topbar__controls">
      <div class="segmented" role="radiogroup" aria-label="Фільтр задач">
        <button type="button" role="radio" data-filter="all">Усі</button>
        <button type="button" role="radio" data-filter="open">Незакриті</button>
      </div>
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="Змінити тему">◐</button>
    </div>
  </header>

  <main>
    <div class="banner banner--error" id="error-banner" hidden></div>

    <section class="hero card" aria-labelledby="hero-label">
      <div>
        <p class="tile__label" id="hero-label">Задач виконано</p>
        <p class="hero__value" id="hero-value">—</p>
        <div class="meter" aria-hidden="true"><span class="meter__fill" id="hero-meter"></span></div>
      </div>
      <dl class="counts" id="counts"></dl>
    </section>

    <section class="stages" id="stages" aria-label="Етапи проєкту"></section>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
